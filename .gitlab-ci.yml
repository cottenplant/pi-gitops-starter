# Self-validating: this repo renders its own template, tests the rendered app,
# and builds its own flux skeleton on every pipeline. The repo being green IS
# the demo. Four independent jobs, one implicit stage — maximally parallel.

prettier:
  image: node:22-slim
  script:
    - npx prettier@3.9.5 --check "**/*.{md,yml,yaml,json}"

# Full-history secret scan — table stakes for a public repo.
secret-scan:
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0" # full clone so the whole history is scanned
  script:
    - gitleaks git --no-banner --redact .

# Render the template with default answers, fail if the committed example
# drifted, then prove the rendered project actually works.
template-validate:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  script:
    - uvx copier copy --defaults --vcs-ref=HEAD . /tmp/rendered/example-app
    - diff -r --exclude=.copier-answers.yml /tmp/rendered/example-app example/example-app
    - cd /tmp/rendered/example-app
    - uv sync
    - uv run pytest -q

# Every flux entry point must build, and the output must be schema-valid.
# Flux CRs (Image*, Kustomization) have no upstream schemas and are skipped.
kustomize-validate:
  image: alpine:3.22
  variables:
    KUSTOMIZE_VERSION: v5.8.1
    KUBECONFORM_VERSION: v0.8.0
  script:
    - ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64) ARCH=arm64 ;; esac
    - wget -qO- "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_${ARCH}.tar.gz" | tar xz -C /usr/local/bin
    - wget -qO- "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-${ARCH}.tar.gz" | tar xz -C /usr/local/bin
    - kustomize build flux/apps/example-app | kubeconform -strict -ignore-missing-schemas -summary
    - kustomize build flux/images | kubeconform -strict -ignore-missing-schemas -summary
    # `flux bootstrap` creates the parent kustomization at runtime. Validate the
    # skeleton's three cluster-entry resources directly in the meantime.
    - kubeconform -strict -ignore-missing-schemas -summary flux/clusters/demo/apps.yaml flux/clusters/demo/images.yaml flux/clusters/demo/image-update-automation.yaml
