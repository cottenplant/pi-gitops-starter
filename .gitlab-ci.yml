# Self-validating skeleton: this repo renders its own template and builds its own
# flux skeleton on every pipeline. The repo being green IS the demo.
# SKELETON: job bodies are drafts — unvalidated until v1. Open questions:
#   - runner arch/tags (gitlab.com arm64 SaaS runners vs self-hosted)
#   - pin tool versions (copier, kustomize, kubeconform) once chosen

stages: [lint, render, validate]

markdownlint:
  stage: lint
  image: davidanson/markdownlint-cli2 # TODO(v1): pin version
  script:
    - markdownlint-cli2 "**/*.md"

prettier:
  stage: lint
  image: node:22-slim # TODO(v1): pin version
  script:
    - npx prettier@3 --check "**/*.{md,yml,yaml,json}"

# Render the template with default answers and fail if the committed example drifted.
render-drift:
  stage: render
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim # TODO(v1): pin version
  script:
    - uvx copier copy --defaults --vcs-ref=HEAD . /tmp/rendered/example-app
    - diff -r --exclude=.copier-answers.yml /tmp/rendered/example-app example/example-app

# Every flux entry point must build, and the output must be schema-valid.
kustomize-validate:
  stage: validate
  image: alpine:3 # TODO(v1): proper image with kustomize + kubeconform pinned
  script:
    - kustomize build flux/apps/example-app | kubeconform -strict -ignore-missing-schemas
