# Markdown standard mirrored from the source cluster's repos: prettier
# (proseWrap: always) owns FORMATTING — word-wrap, table/pipe spacing;
# markdownlint owns STRUCTURE + the rules prettier can't cover.
---
config:
  default: true
  MD013: false # line-length: prettier owns wrapping (proseWrap: always)
  MD024:
    siblings_only: true # repeated headings allowed under different sections
  MD033: false # inline HTML
  MD041: false # first-line-heading: READMEs may open with an img/badge block
  MD046:
    style: fenced # fenced code blocks (```), not indented
  MD060: false # table-column-style: prettier owns table spacing
ignores:
  - "**/.venv/**"
  - "**/node_modules/**"
