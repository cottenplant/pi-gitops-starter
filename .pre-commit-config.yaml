# Contributor hooks for working on the starter itself. CI stays the authority:
# prettier and gitleaks run there on every pipeline; these catch the same
# problems before they reach a commit.
# *.jinja templates: the parsers (check-yaml, ruff, yamllint, prettier) skip
# them by file type, while the plain-text fixers process template and rendered
# example alike, which keeps the template-validate render diff clean.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # line-length is a warning, not an error: CI shell one-liners run long.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-d", "{extends: relaxed, rules: {line-length: {max: 120, level: warning}}}"]
        types: [yaml]

  # Same prettier version the CI job pins; the rbubley fork mirrors it for
  # pre-commit (pre-commit/mirrors-prettier is archived, frozen at 3.1.0).
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.5
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
