# One Flux Kustomization per app, named apps-<name>. Add one block per app.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-example-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/apps/example-app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 3m
  # Building sops-encrypted files (e.g. the pull-secret component)? Enable:
  # decryption:
  #   provider: sops
  #   secretRef:
  #     name: sops-age
