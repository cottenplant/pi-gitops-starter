# One Flux Kustomization per app, named apps-<name>. Add one block per app.
# SKELETON: intervals/timeouts are placeholders until v1.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-example-app
  namespace: flux-system
spec:
  interval: 10m
  path: ./flux/apps/example-app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 3m
