# `namespace: example-app` stamps every namespaced resource below — including
# anything a component injects — into the app's namespace. The flux-system
# ImageRepository/ImagePolicy pair lives in ./image with its OWN kustomization
# so this transformer can't rewrite it (see image/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: example-app
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - allow-http.yaml
components:
  - ../../components/network-policies
  # Pulling from a private registry? Encrypt the pull secret first, then enable:
  # - ../../components/pull-secret
