# Selects the newest image by the unix-timestamp prefix of the tag
# (<unix-ts>-<shortsha> — see the template's .gitlab-ci.yml build job). The sha
# suffix keeps tags traceable without participating in the sort.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: example-app
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: example-app
  filterTags:
    pattern: "^(?P<ts>[0-9]+)-[0-9a-f]+$"
    extract: "$ts"
  policy:
    numerical:
      order: asc
