# Build + push to the GitLab registry with tags Flux image automation can sort.
# SKELETON: job bodies land at v1. Open decisions: build tool (buildah/kaniko/buildx)
# and runner arch (native arm64 runner vs qemu cross-build).
stages: [test, build]

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  script:
    - uv sync --frozen
    - uv run pytest

build:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
