# Copier configuration. The template files live under template/ (_subdirectory);
# everything else in this repo is documentation, the rendered example, and the flux skeleton.

_subdirectory: template
_min_copier_version: "9.0.0"

app_name:
  type: str
  help: Service name (kebab-case; used for the image name and k8s resources)
  default: example-app

python_package:
  type: str
  help: Python import package name
  default: "{{ app_name | replace('-', '_') }}"

description:
  type: str
  help: One-line service description
  default: A small service.

python_version:
  type: str
  help: Python version
  default: "3.13"

port:
  type: int
  help: HTTP port the service listens on
  default: 8000
